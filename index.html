<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Editais Abertos — FAPEAM</title>
  <style>
    :root{
      --bg:#f4f6f6; --card:#fff; --text:#1f2937; --muted:#6b7280;
      --brand:#4b6b5f; --chip:#e9f0ec; --border:#e5e7eb;
      --btn:#4b6b5f; --btn2:#e9f0ec;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:var(--bg)}
    header{background:var(--brand);color:#fff;padding:14px 18px}
    header .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    header .title{display:flex;gap:10px;align-items:center}
    header .badge{background:rgba(255,255,255,.18);padding:6px 10px;border-radius:999px;font-size:12px}
    main{max-width:980px;margin:22px auto;padding:0 14px}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 10px 20px rgba(0,0,0,.04)}
    h1{margin:0 0 6px 0;font-size:22px}
    p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 8px}
    button{border:0;border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer}
    .btn{background:var(--btn);color:#fff}
    .btn2{background:var(--btn2);color:var(--text)}
    .filters{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px;margin-top:10px}
    input, select{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px}
    .list{margin-top:16px;display:flex;flex-direction:column;gap:12px}
    .group{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
    .grouphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .gtitle{font-weight:800}
    .count{font-size:12px;color:var(--muted);background:#f3f4f6;border-radius:999px;padding:4px 8px}
    .item{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:14px;padding:12px}
    .num{width:28px;height:28px;border-radius:999px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 28px}
    .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
    .chip{background:var(--chip);border:1px solid #d7e4dd;color:#2f4a40;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700}
    a{color:inherit}
    .link{color:var(--muted);font-size:13px;word-break:break-all}
    footer{max-width:980px;margin:18px auto;padding:0 14px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    @media (max-width:860px){ .filters{grid-template-columns:1fr 1fr} }
    @media (max-width:520px){ .filters{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <div class="title">
        <strong>FVS-RCP · DEPI</strong>
        <span style="opacity:.9;font-size:13px">Painel público de links — Editais (FAPEAM)</span>
      </div>
      <div class="row" style="gap:8px">
        <span class="badge" id="updated">Atualizado: —</span>
        <span class="badge" id="total">Total: —</span>
        <span class="badge" id="source">Fonte: —</span>
      </div>
    </div>
  </header>

  <main>
    <div class="panel">
      <h1>Editais Abertos — FAPEAM</h1>
      <p>Modo simples (manual). Lista de links para consulta rápida.</p>

      <div class="actions">
        <button class="btn" id="copyAll">Copiar tudo</button>
        <button class="btn2" id="print">Imprimir / Salvar PDF</button>
        <button class="btn2" id="reset">Limpar filtros</button>
      </div>

      <div class="filters">
        <input id="q" placeholder="Busca (título ou link)" />
        <select id="area"><option value="">Área: Todas</option></select>
        <select id="type"><option value="">Tipo: Todos</option></select>
        <select id="sort">
          <option value="title">Ordenação: Título</option>
          <option value="none">Ordenação: Nenhuma</option>
        </select>
      </div>

      <div class="list" id="list"></div>
    </div>
  </main>

  <footer>
    <div>Documento público (GitHub Pages) — FVS-RCP/DEPI</div>
    <div id="footSource">Fonte: —</div>
  </footer>

<script>
  const $ = (id)=>document.getElementById(id);

  let RAW = [];
  let META = {updated_at:"", source:""};

  function uniq(arr){ return [...new Set(arr)].filter(Boolean).sort((a,b)=>a.localeCompare(b)); }

  function hydrateFilters(items){
    const areas = uniq(items.map(x=>x.area||""));
    const types = uniq(items.map(x=>x.type||""));

    $("area").innerHTML = `<option value="">Área: Todas</option>` + areas.map(a=>`<option>${a}</option>`).join("");
    $("type").innerHTML = `<option value="">Tipo: Todos</option>` + types.map(t=>`<option>${t}</option>`).join("");
  }

  function normalize(x){
    return {
      title: (x.title || "Edital").trim(),
      url: (x.url || "").trim(),
      area: (x.area || "Geral").trim(),
      type: (x.type || "Edital").trim(),
      date: (x.date || "").trim()
    };
  }

  function filtered(){
    const q = $("q").value.trim().toLowerCase();
    const area = $("area").value.trim();
    const type = $("type").value.trim();
    let items = RAW.slice();

    if(q){
      items = items.filter(x =>
        x.title.toLowerCase().includes(q) || x.url.toLowerCase().includes(q)
      );
    }
    if(area) items = items.filter(x => x.area === area);
    if(type) items = items.filter(x => x.type === type);

    const sort = $("sort").value;
    if(sort === "title"){
      items.sort((a,b)=>a.title.localeCompare(b.title));
    }
    return items;
  }

  function render(){
    const items = filtered();
    $("total").textContent = `Total: ${items.length} editais`;

    const groupTitle = "Data: Sem data";
    const htmlItems = items.map((x,i)=>`
      <div class="item">
        <div class="num">${i+1}</div>
        <div style="flex:1">
          <div class="meta">
            <span class="chip">${x.area}</span>
            <span class="chip">${x.type}</span>
          </div>
          <div style="font-weight:800">${escapeHtml(x.title)}</div>
          <div class="link"><a href="${escapeAttr(x.url)}" target="_blank" rel="noopener">${escapeHtml(x.url)}</a></div>
        </div>
      </div>
    `).join("");

    $("list").innerHTML = `
      <div class="group">
        <div class="grouphead">
          <div class="gtitle">${groupTitle}</div>
          <div class="count">${items.length} edital(is)</div>
        </div>
        ${htmlItems || `<div style="color:var(--muted);font-size:14px">Nenhum item encontrado.</div>`}
      </div>
    `;
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  async function init(){
    const res = await fetch("./data.json", {cache:"no-store"});
    const data = await res.json();

    META.updated_at = data.updated_at || "";
    META.source = data.source || "manual";
    RAW = (data.items || []).map(normalize);

    $("updated").textContent = `Atualizado: ${META.updated_at || "—"}`;
    $("source").textContent = `Fonte: ${META.source}`;
    $("footSource").textContent = `Fonte: ${META.source}`;

    $("total").textContent = `Total: ${RAW.length} editais`;

    hydrateFilters(RAW);
    render();
  }

  $("q").addEventListener("input", render);
  $("area").addEventListener("change", render);
  $("type").addEventListener("change", render);
  $("sort").addEventListener("change", render);

  $("reset").addEventListener("click", ()=>{
    $("q").value="";
    $("area").value="";
    $("type").value="";
    $("sort").value="title";
    render();
  });

  $("print").addEventListener("click", ()=>window.print());

  $("copyAll").addEventListener("click", async ()=>{
    const items = filtered();
    const text = items.map(x=>`${x.title}\n${x.url}\n`).join("\n");
    try{
      await navigator.clipboard.writeText(text);
      $("copyAll").textContent = "Copiado!";
      setTimeout(()=> $("copyAll").textContent="Copiar tudo", 1200);
    }catch(e){
      alert("Não foi possível copiar automaticamente. Selecione e copie manualmente.");
    }
  });

  init();
</script>
</body>
</html>
