name: Update data.json (FAPEAM)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * 1"   # segunda-feira 09:00 UTC (05:00 Manaus)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf

      - name: Run scraper (with retry)
  run: |
    for i in 1 2 3; do
      python scripts/scrape_fapeam.py && break
      echo "Tentativa $i falhou. Aguardando..."
      sleep $((i*20))
    done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Atualiza data.json (automático)"
          git push
