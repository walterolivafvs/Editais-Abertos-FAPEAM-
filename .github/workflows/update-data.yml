name: Atualizar data.json (FAPEAM)

on:
  workflow_dispatch:
  schedule:
    # toda segunda-feira às 09:00 UTC
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run updater
        run: |
          python scripts/scrape_fapeam.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update data.json" || echo "No changes"
          git push
