name: Update data.json (FAPEAM)

on:
  workflow_dispatch: {}
  schedule:
    # Toda segunda-feira às 09:00 (UTC) -> em Manaus normalmente é 05:00 (ajuste se quiser)
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf

      - name: Run scraper
        run: |
          python scripts/scrape_fapeam.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data.json" && git push)
