name: Update data.json (FAPEAM)

on:
  workflow_dispatch:
  schedule:
    # Toda segunda-feira às 09:00 UTC (05:00 em Manaus)
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf

      - name: Run scraper (with retry protection)
        run: |
          echo "Running FAPEAM scraper..."
          for i in 1 2 3 4 5; do
            python scripts/scrape_fapeam.py && break
            echo "Attempt $i failed. Waiting 15 seconds..."
            sleep 15
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [[ `git status --porcelain` ]]; then
            git add data.json
            git commit -m "Atualização automática do data.json (FAPEAM)"
            git push
          else
            echo "No changes to commit"
          fi
