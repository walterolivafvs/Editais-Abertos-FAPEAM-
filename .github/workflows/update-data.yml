name: Update data.json (FAPEAM)

on:
  workflow_dispatch:
  schedule:
    # Toda segunda-feira às 09:00 UTC (05:00 em Manaus)
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf

      - name: Run scraper (retry 5x)
        run: |
          set -e
          echo "Running scripts/scrape_fapeam.py with retries..."
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5"
            if python scripts/scrape_fapeam.py; then
              echo "Scraper succeeded."
              exit 0
            fi
            echo "Scraper failed. Waiting 15s..."
            sleep 15
          done
          echo "Scraper failed after 5 attempts."
          exit 1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add data.json
            git commit -m "Atualização automática do data.json (FAPEAM)"
            git push
          else
            echo "No changes to commit."
          fi
