name: Update FAPEAM data.json

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"   # todo dia 11:00 UTC (~07:00 Manaus)
  push:
    branches: ["main"]
    paths:
      - "scripts/scrape_fapeam.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        run: python scripts/scrape_fapeam.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update data.json"
          git push
